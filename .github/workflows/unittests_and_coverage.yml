name: Unittests and Coverage

on: [push, pull_request]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Run Tests
        working-directory: ./TimeSliceNet
        run: dotnet test --configuration Release
  coverage:
    needs: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Install dependencies
        working-directory: ./TimeSliceNet
        run: dotnet restore
      - name: Install coverlet.msbuild in TimeSliceTests
        working-directory: ./TimeSliceNet/TimeSliceTests
        run: dotnet add package coverlet.msbuild
      - name: Measure Test Coverage
        working-directory: ./TimeSliceNet
        run: dotnet test --framework net10.0 /p:Threshold=95 /p:Include=\"[*]TimeSlice.*,[*]TimeSliceEntityFrameworkExtensions.*\" /p:ThresholdType=line /p:CollectCoverage=true /p:SkipAutoProps=true /p:CoverletOutputFormat=lcov --configuration Release
